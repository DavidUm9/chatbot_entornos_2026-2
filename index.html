<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1 class="clase-titulo">
    Hola Mundo. Me llamo Alejandro.
  </h1>
  <p class="clase-parrafo" id="parrafo-llm">
    CHATBOT!. 
  </p>
  <button id="boton-accionador">
    ACEPTAR
  </button>
  <input type="Ingrese Texto" id="input-prompt">
  <a href="https://www.google.com">Ir a google.com</a>
  <img src="" alt="">
  <script>
    document.getElementById("boton-accionador").onclick = async () => {
      const prompt = document.getElementById("input-prompt").value;
      const res = await fetch("http://localhost:8000/chat/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ texto: prompt })
      })
      const datos = await res.json()
      const parrafo = document.getElementById("parrafo-llm");
      parrafo.style.whiteSpace = "pre-wrap";
      parrafo.textContent += `\nTú: ${prompt}\nIA: ${datos.Respuesta}\n`;
    }

    const cargarHistorial = async () => {
      const res = await fetch("http://localhost:8000/mensajes/");
      const mensajes = await res.json();
      mensajes.sort((a, b) => a.id - b.id);
      const parrafo = document.getElementById("parrafo-llm");
      parrafo.style.whiteSpace = "pre-wrap";
      mensajes.forEach((m) => {
        const autor = m.rol === "usuario" ? "Tú" : "IA";
        parrafo.textContent += `\n${autor}: ${m.texto}\n`;
      });
    };

    cargarHistorial();

    </script>
</body>
</html>
